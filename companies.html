function timeAgo(iso) {
  if (!iso) return "";
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return mins + " min ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

function drawSpark(svg, series, prevClose, up) {
  const W = 100, H = 100;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  if (series.length < 2) return;
  const all = series.concat([prevClose]);
  const min = Math.min(...all), max = Math.max(...all);
  const span = (max - min) || 1;
  const y = v => H - 6 - ((v - min) / span) * (H - 12);
  const x = i => (i / (series.length - 1)) * W;

  const base = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  base.setAttribute("class", "base");
  base.setAttribute("points", `0,${y(prevClose)} ${W},${y(prevClose)}`);
  svg.appendChild(base);

  const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  line.setAttribute("points", series.map((v, i) => `${x(i)},${y(v)}`).join(" "));
  line.setAttribute("stroke", up ? "var(--up)" : "var(--down)");
  line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(line);
}

  card.innerHTML = `
    <div class="co-top"><span class="tick"></span><span class="badge"></span></div>
    <div class="co-name"></div>
    <svg class="spark" preserveAspectRatio="none"></svg>
    <div class="co-nums"><span class="price"></span><span class="delta ${up ? "up" : "down"}"></span></div>`;
  card.querySelector(".tick").textContent = c.symbol;
  card.querySelector(".badge").textContent = c.badge;
  card.querySelector(".co-name").textContent = c.name;
  card.querySelector(".price").textContent = "$" + c.price.toLocaleString("en-US");
  card.querySelector(".delta").textContent = (up ? "▲ +" : "▼ ") + c.changePct.toFixed(2) + "%";
  drawSpark(card.querySelector(".spark"), c.spark, c.prevClose, up);
  card.addEventListener("click", () => openCompany(c));
  grid.appendChild(card);
});

const modal = document.getElementById("modal");
function openCompany(c) {
  const up = c.changePct >= 0;
  document.getElementById("m-badge").textContent = c.badge;
  document.getElementById("m-tick").textContent = c.symbol;
  document.getElementById("m-name").textContent = c.name;
  document.getElementById("m-price").textContent = "$" + c.price.toLocaleString("en-US");
  const delta = document.getElementById("m-delta");
  delta.textContent = (up ? "▲ +" : "▼ ") + c.changePct.toFixed(2) + "% today";
  delta.className = "delta " + (up ? "up" : "down");
  document.getElementById("m-prev").textContent = "$" + c.prevClose.toLocaleString("en-US");
  document.getElementById("m-low").textContent = "$" + c.dayLow.toLocaleString("en-US");
  document.getElementById("m-high").textContent = "$" + c.dayHigh.toLocaleString("en-US");
  drawSpark(document.getElementById("m-spark"), c.spark, c.prevClose, up);

  const list = document.getElementById("m-news");
  list.innerHTML = "";
  if (c.news.length === 0) {
    const li = document.createElement("li");
    li.style.cssText = "color:var(--muted);font-size:0.9rem;padding:10px 2px";
    li.textContent = "No recent headlines for this ticker.";
    list.appendChild(li);
  }
  c.news.forEach(n => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = n.link; a.target = "_blank"; a.rel = "noopener";
    const t = document.createElement("div");
    t.className = "t"; t.textContent = n.title;
    const time = document.createElement("time");
    time.textContent = timeAgo(n.published);
    a.appendChild(t); a.appendChild(time);
    li.appendChild(a); list.appendChild(li);
  });
  document.getElementById("m-link").href = "https://finance.yahoo.com/quote/" + encodeURIComponent(c.symbol);
  modal.showModal();
}
document.getElementById("modal-close").addEventListener("click", () => modal.close());
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
</script>
</body>
</html>
